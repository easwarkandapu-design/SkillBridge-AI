services:
  db:
    image: postgres:16
    container_name: skillbridge-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: skillbridge_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - skillbridge_pgdata:/var/lib/postgresql/data
volumes:
  skillbridge_pgdata:
